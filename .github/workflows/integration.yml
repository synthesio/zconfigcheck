# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    strategy:
      matrix:
        os: [ "ubuntu-latest", "macos-latest" ]
        go_version : [ "oldstable", "stable" ]
        # check against a known version and the latest version of golangci-lint
        golangci_version: [ "v2.1.6", "latest" ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go_version }}

    - name: Validate zconfigcheck works with golangci-lint
      working-directory: testdata/validate
      run: ./build.sh ${{ matrix.golangci_version }}